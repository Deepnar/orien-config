# ─────────────────────────────────────────────
# PREFIX
# ─────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind r
bind r source-file ~/.tmux.conf
# ─────────────────────────────────────────────
# DIRECT WINDOW CONTROLS — NO PREFIX
# ─────────────────────────────────────────────

# Ctrl+N → new window
bind -n C-n new-window -c "#{pane_current_path}"

# Ctrl+X → close current window immediately
bind -n C-x kill-window

# Ctrl+Right / Ctrl+Left → cycle windows
bind -n C-Right next-window
bind -n C-Left previous-window


# ─────────────────────────────────────────────
# GHOSTTY CUSTOM KEYS
#
# Ghostty sends custom CSI sequences for keys
# terminals normally cannot distinguish reliably.
# ─────────────────────────────────────────────

set -s user-keys[0]  "\e[101~"
set -s user-keys[1]  "\e[102~"
set -s user-keys[2]  "\e[103~"
set -s user-keys[3]  "\e[104~"
set -s user-keys[4]  "\e[105~"
set -s user-keys[5]  "\e[106~"
set -s user-keys[6]  "\e[107~"
set -s user-keys[7]  "\e[108~"
set -s user-keys[8]  "\e[109~"

set -s user-keys[9]  "\e[110~"
set -s user-keys[10] "\e[111~"


# Ctrl+1 ... Ctrl+9 → jump directly to window
bind -n User0 select-window -t :=1
bind -n User1 select-window -t :=2
bind -n User2 select-window -t :=3
bind -n User3 select-window -t :=4
bind -n User4 select-window -t :=5
bind -n User5 select-window -t :=6
bind -n User6 select-window -t :=7
bind -n User7 select-window -t :=8
bind -n User8 select-window -t :=9

# Ctrl+Tab → next window
bind -n User9 next-window

# Ctrl+Shift+Tab → previous window
bind -n User10 previous-window


# ─────────────────────────────────────────────
# PREFIX CONTROLS
# ─────────────────────────────────────────────

# Ctrl+A, Tab → last-used window
bind Tab last-window

# Ctrl+A, r → reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"


# ─────────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────────

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 100000
set -sg escape-time 0

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"


# ─────────────────────────────────────────────
# TMUX SPLITS
# ─────────────────────────────────────────────

# Alt+- → horizontal split (top/bottom)
bind -n M-- split-window -v -c "#{pane_current_path}"

# Alt+\ → vertical split (left/right)
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
# ─────────────────────────────────────────────
# TMUX PANE NAVIGATION
# ─────────────────────────────────────────────

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Force tmux to use 256 colors and passthrough Ghostty's transparency
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:Bc"

# Reset active and inactive panes to clear default cells
# set -ug window-style
# set -ug window-active-style
# set -g window-style bg=default
# set -g window-active-style bg=default

# ╭────────────────────────────────────────────╮
# │       TMUX — CAELESTIA BLUE PILLS          │
# ╰────────────────────────────────────────────╯

set -g status on
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=default,fg=default"

set -g status-left-length 50
set -g status-right-length 100
set -g window-status-separator " "

# Do not tint terminal panes
set -g window-style "default"
set -g window-active-style "default"


# Session pill
set -g status-left \
"#[fg=cyan]#[fg=black,bg=cyan,bold] 󰆍 #S #[fg=cyan,bg=default] "


# Inactive windows — dark pill
setw -g window-status-format \
"#[fg=black]#[fg=white,bg=black] #I  #W #[fg=black,bg=default]"


# Active window — blue pill
setw -g window-status-current-format \
"#[fg=blue]#[fg=black,bg=blue,bold] #I #[fg=cyan,bg=blue]● #[fg=black,bg=blue,bold]#W #[fg=blue,bg=default]"


# Activity / alerts
setw -g window-status-activity-style "fg=cyan,bold"
setw -g window-status-bell-style "fg=red,bold"


# Host + time — dark pills
set -g status-right \
"#[fg=black]#[fg=white,bg=black] 󰒋 #H #[fg=black,bg=default] \
#[fg=black]#[fg=white,bg=black]  %H:%M #[fg=black,bg=default] "


# Pane borders
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=blue"

set -g display-panes-colour "black"
set -g display-panes-active-colour "cyan"


# Messages / copy mode
set -g message-style "bg=black,fg=white,bold"
set -g message-command-style "bg=black,fg=cyan,bold"
setw -g mode-style "bg=black,fg=cyan,bold"
