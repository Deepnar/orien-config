[fill]
symbol = ' '

# --- CORE PROMPT ELEMENTS ---

[os]
disabled = false
style = "bold bright-white"
format = "[$symbol ]($style)"

[os.symbols]
Arch = ""
CachyOS = ""
Linux = ""

[directory]
style = "bold bright-blue"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[character]
success_symbol = "[❯](bold bright-green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold bright-yellow)"

[status]
disabled = false
format = "[✘ $status ](bold red)"

[time]
disabled = false
format = "[ $time ](dimmed white)"
time_format = "%H:%M"

[cmd_duration]
min_time = 3000
format = "[took $duration ](italic dimmed white)"

# --- GIT INTEGRATION ---

[git_branch]
format = "[$symbol$branch(:$remote_branch) ]($style)"
symbol = " "
style = "bold purple"
truncation_symbol = "⋯"
truncation_length = 15
only_attached = true

[git_status]
style = "bold bright-blue"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style) )"
conflicted = "[◪ ](italic bright-magenta)"
ahead = "[⇡${count} ](italic green)"
behind = "[⇣${count} ](italic red)"
diverged = "[⇡${ahead_count}⇣${behind_count} ](italic bright-magenta)"
untracked = "[?${count} ](italic bright-yellow)"
stashed = "[*${count} ](italic white)"
modified = "[!${count} ](italic yellow)"
staged = "[+${count} ](italic bright-cyan)"
renamed = "[»${count} ](italic bright-blue)"
deleted = "[✘${count} ](italic red)"

[git_metrics]
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
disabled = false

# --- CLOUD & ENVIRONMENTS ---

[aws]
symbol = " "
format = "[$symbol($profile) ](bold bright-yellow)"

[azure]
symbol = "󰠅 "
format = "[$symbol($subscription) ](bold bright-blue)"

[gcloud]
symbol = "󱇶 "
format = "[$symbol($account) ](bold bright-blue)"

[conda]
symbol = " "
format = "[$symbol$environment ](bold bright-green)"

[docker_context]
symbol = " "
format = "[$symbol$context ](bold bright-blue)"

[kubernetes]
symbol = "󱃾 "
format = "[$symbol$context ](bold bright-cyan)"

[terraform]
symbol = "󱁢 "
format = "[$symbol$workspace ](bold bright-purple)"

